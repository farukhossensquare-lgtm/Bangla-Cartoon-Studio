name: Build Cartoon App APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Create Android project
    run: |
      flutter create --platforms=android --project-name bangla_cartoon_studio app

  - name: Copy app files
    run: |
      unzip -oq bangla_cartoon_studio_project.zip -d project_files
      cp -r project_files/lib app/
      cp project_files/pubspec.yaml app/
      cp project_files/analysis_options.yaml app/

  - name: Install dependencies
    working-directory: app
    run: flutter pub get

  - name: Build APK
    working-directory: app
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: bangla-cartoon-studio-apk
      path: app/build/app/outputs/flutter-apk/app-release.apk
